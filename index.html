<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ✅ 1. Supabase connection
  const SUPABASE_URL = 'https://nurmozhzovpwrcjhlzoa.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51cm1vemh6b3Zwd3Jjamhsem9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxMDU3ODEsImV4cCI6MjA4NDY4MTc4MX0.L0poLQBppymW9mJtPbs9dhfclOQOU9FgERaoTv44jfM';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ✅ 2. Generalized form handler
  async function handleForm(formSelector, table, emailSubject) {
    const form = document.querySelector(formSelector);
    if (!form) {
      console.warn(`Form ${formSelector} not found.`);
      return;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Gather form data
      const formData = Object.fromEntries(new FormData(form).entries());
      console.log("Submitting form data:", formData);

      // ✅ 3. Save data in Supabase
      const { error } = await supabase.from(table).insert([formData]);
      if (error) {
        console.error('Supabase error:', error.message);
        alert('❌ Error saving your submission. Please try again.');
        return;
      }

      // ✅ 4. Send data to Zapier (email + HubSpot flow)
      try {
        const zapierResponse = await fetch('https://hooks.zapier.com/hooks/catch/24564789/uqp4rwx/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            formType: table,
            subject: emailSubject,
            recipient: 'admin@kaizarildinternational.com',
            ...formData
          })
        });

        if (!zapierResponse.ok) {
          throw new Error(`Zapier webhook error: ${zapierResponse.statusText}`);
        }

        console.log("Zapier request sent successfully!");
        alert('✅ Your message has been sent successfully!');
        form.reset();

      } catch (err) {
        console.error('Error sending to Zapier:', err);
        alert('⚠️ Your submission was saved, but the email alert failed.');
      }
    });
  }

  // ✅ 5. Attach handlers once page loads
  document.addEventListener('DOMContentLoaded', () => {
    handleForm('#contact-form', 'contacts', 'New Contact/Consultation Request');
    handleForm('#demo-form', 'demos', 'New Demo Request');
    handleForm('#trainer-form', 'trainers', 'New Trainer Application');
    handleForm('#course-form', 'course_registrations', 'New Course Registration');
  });
</script>
